name: Test
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint (shellcheck)
        run: shellcheck lock.sh test/test.sh

  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test script
        shell: bash
        run: bash test/test.sh

      - name: Run script under lock
        uses: ./
        with:
          name: test-run
          run: |
            test "$FROM_STEP" = step
            test -d "$HOME/.lock-action/test-run.lock"
            echo "RAN_UNDER_LOCK=yes" >> $GITHUB_ENV
        env:
          FROM_STEP: step

      - name: Check lock was released after script
        shell: bash
        run: |
          test "$RAN_UNDER_LOCK" = yes
          test ! -e "$HOME/.lock-action/test-run.lock"

      - name: Acquire lock
        uses: ./
        with:
          name: test-hold

      - name: Check lock is held across steps
        shell: bash
        run: test -d "$HOME/.lock-action/test-hold.lock"

      - name: Release lock
        if: always()
        uses: ./release
        with:
          name: test-hold

      - name: Check lock was released
        shell: bash
        run: test ! -e "$HOME/.lock-action/test-hold.lock"
